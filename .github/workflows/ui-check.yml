name: UI and learning checks
on:
  push:
    branches: [design/spot-instrument]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install isolated browser-test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise the actual renderer with the real learning engine
        run: node tests/ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spot-ui-review
          path: |
            artifacts/ui
            dist
          retention-days: 7
